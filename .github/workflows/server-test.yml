name: Server test

# Starts real Forge servers with the mod:
#  1. Old world: save a world with the last "wolfhorse" release (1.21.0) holding a tamed DireWolf,
#     a Plains DireWolf, and a chest of old items (fur, spawn egg, pelt-trimmed armor, a packed backpack).
#  2. Load that same world with this build and check everything converted to the new "fotm" ids.
#  3. Place each Den and check the DireWolf pack, and find each Den with /locate.
on:
  push:
    branches: [ smoke-test ]
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
      - name: Install a Forge server
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          FORGE=$(grep '^forge_version=' gradle.properties | cut -d= -f2)
          curl -sSfL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC}-${FORGE}/forge-${MC}-${FORGE}-installer.jar"
          mkdir server && cd server && java -jar ../installer.jar --installServer > install.log 2>&1 && tail -2 install.log
          mkdir -p mods && chmod +x run.sh
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-seed=12345\nspawn-protection=0\nmax-tick-time=-1\n" > server.properties
          curl -sSfL -o ../old.jar "https://github.com/${{ github.repository }}/releases/download/v1.21.0/fangs-of-the-mountains-1.21.0.jar"
          curl -sSfL -o ../mid.jar "https://github.com/${{ github.repository }}/releases/download/v1.23.1/fangs-of-the-mountains-1.23.1.jar"
          cat > ../serve.sh <<'SH'
          # usage: serve.sh <log> <commands file>   (one command per line, "wait N" pauses)
          cd server; rm -f console; mkfifo console
          ./run.sh nogui < console > "$1" 2>&1 &
          exec 3>console
          for i in $(seq 1 120); do grep -q 'Done (' "$1" && break; sleep 5; done
          grep -q 'Done (' "$1" || { tail -60 "$1"; echo "Server did not start"; exit 1; }
          while IFS= read -r line; do
            case "$line" in wait*) sleep "${line#wait }";; *) echo "$line" >&3; sleep 3;; esac
          done < "$2"
          echo stop >&3; sleep 25; exec 3>&-; wait || true
          SH
          chmod +x ../serve.sh
      - name: "1. Save a world with the old version (1.21.0)"
        if: "!contains(github.event.head_commit.message, '[hunt-only]')"
        run: |
          cp old.jar server/mods/
          cat > old.cmds <<'C'
          forceload add -16 -16 16 16
          wait 5
          setblock 2 100 2 stone
          setblock 5 100 5 stone
          summon wolfhorse:forest_direwolf 5 101 5 {Tame:1b,CustomName:'"Ash"',PersistenceRequired:1b}
          summon wolfhorse:wolf_horse 2 101 2 {PersistenceRequired:1b}
          setblock 0 100 0 chest{Items:[{Slot:0b,id:"wolfhorse:fur",Count:5b},{Slot:1b,id:"wolfhorse:wolf_horse_spawn_egg",Count:1b},{Slot:2b,id:"minecraft:iron_chestplate",Count:1b,tag:{Trim:{pattern:"wolfhorse:pelt",material:"wolfhorse:forest_fur"}}},{Slot:3b,id:"wolfhorse:direwolf_backpack",Count:1b,tag:{DireWolf:{id:"wolfhorse:tundra_direwolf"},DireWolfName:"Frost"}}]}
          wait 5
          execute if entity @e[type=wolfhorse:forest_direwolf]
          data get block 0 100 0 Items
          C
          ./serve.sh old.log ../old.cmds
          grep -E 'Test passed|Test failed|has the following block data|Unknown|Error' server/old.log | cut -c1-400
      - name: "1b. Open it with 1.23.1 and add Forest things"
        if: "!contains(github.event.head_commit.message, '[hunt-only]')"
        run: |
          rm server/mods/*.jar && cp mid.jar server/mods/
          cat > mid.cmds <<'C'
          wait 5
          execute if entity @e[type=fotm:forest_direwolf,name=Ash]
          setblock 8 100 8 stone
          summon fotm:forest_direwolf 8 101 8 {CustomName:'"Bramble"',PersistenceRequired:1b}
          setblock 0 100 3 chest{Items:[{Slot:0b,id:"fotm:forest_fur",Count:3b},{Slot:1b,id:"fotm:forest_fur_helmet",Count:1b},{Slot:2b,id:"minecraft:iron_chestplate",Count:1b,tag:{Trim:{pattern:"fotm:scarf",material:"fotm:forest_fur"}}}]}
          wait 5
          C
          ./serve.sh mid.log ../mid.cmds
          grep -E 'Test passed|Test failed' server/mid.log
      - name: "2. Load that world with this build"
        if: "!contains(github.event.head_commit.message, '[hunt-only]')"
        run: |
          rm server/mods/*.jar
          cp build/libs/$(grep '^jar_name=' gradle.properties | cut -d= -f2)-*.jar server/mods/
          cat > new.cmds <<'C'
          wait 5
          execute if entity @e[type=fotm:dark_forest_direwolf,name=Ash]
          execute if entity @e[type=fotm:dark_forest_direwolf,name=Bramble]
          execute if entity @e[type=fotm:plains_direwolf]
          data get block 0 100 0 Items
          data get block 0 100 3 Items
          C
          ./serve.sh migrate.log ../new.cmds
          echo "======== migration results ========"
          grep -E 'Test passed|Test failed|has the following block data|wolfhorse|missing|Missing|remap' server/migrate.log | cut -c1-900
          FAIL=0
          [ "$(grep -c 'Test passed' server/migrate.log)" -ge 3 ] || { echo "FAIL: old DireWolves did not carry over"; FAIL=1; }
          ITEMS=$(grep 'has the following block data' server/migrate.log)
          for want in 'fotm:fur' 'fotm:plains_direwolf_spawn_egg' 'wolfhorse:pelt' 'fotm:direwolf_backpack' 'Frost' 'fotm:dark_forest_fur"' 'fotm:dark_forest_fur_helmet' 'fotm:scarf'; do
            echo "$ITEMS" | grep -q "$want" || { echo "FAIL: chest is missing $want"; FAIL=1; }
          done
          exit $FAIL
      - name: "3. Dens"
        if: "!contains(github.event.head_commit.message, '[hunt-only]')"
        run: |
          cat > den.cmds <<'C'
          forceload add -48 -48 48 48
          wait 10
          place structure fotm:dark_forest_den 0 120 0
          wait 5
          place structure fotm:plains_den 30 120 0
          wait 5
          place structure fotm:tundra_den -30 120 0
          wait 5
          execute if entity @e[type=fotm:dark_forest_direwolf,x=-12,y=-64,z=-12,dx=24,dy=400,dz=24]
          execute if entity @e[type=fotm:plains_direwolf,x=18,y=-64,z=-12,dx=24,dy=400,dz=24]
          execute if entity @e[type=fotm:tundra_direwolf,x=-42,y=-64,z=-12,dx=24,dy=400,dz=24]
          execute as @e[type=fotm:plains_direwolf,x=18,y=-64,z=-12,dx=24,dy=400,dz=24] run data get entity @s Age
          setblock 40 140 40 fotm:roughed_up_podzol
          setblock -40 140 40 fotm:roughed_up_coarse_dirt
          setblock 40 140 -40 fotm:roughed_up_snow
          setblock 40 140 40 air destroy
          setblock -40 140 40 air destroy
          setblock 40 140 -40 air destroy
          wait 2
          execute if entity @e[type=item,x=35,y=-64,z=35,dx=10,dy=400,dz=10]
          execute if entity @e[type=item,x=-45,y=-64,z=35,dx=10,dy=400,dz=10]
          execute if entity @e[type=item,x=35,y=-64,z=-45,dx=10,dy=400,dz=10]
          execute as @e[type=item,x=35,y=-64,z=35,dx=10,dy=400,dz=10] run data get entity @s Item
          execute as @e[type=item,x=-45,y=-64,z=35,dx=10,dy=400,dz=10] run data get entity @s Item
          execute as @e[type=item,x=35,y=-64,z=-45,dx=10,dy=400,dz=10] run data get entity @s Item
          locate structure fotm:plains_den
          wait 30
          locate structure fotm:dark_forest_den
          wait 30
          locate structure fotm:tundra_den
          wait 30
          C
          ./serve.sh den.log ../den.cmds
          echo "======== den results ========"
          grep -E 'Generated structure|Test passed|Test failed|entity data|nearest|Could not|Error|error' server/den.log | cut -c1-300
          FAIL=0
          for d in dark_forest plains tundra; do grep -q "Generated structure \"fotm:${d}_den\"" server/den.log || { echo "FAIL: $d den not placed"; FAIL=1; }; done
          [ "$(grep -c 'Test passed, count: [3-9]' server/den.log)" -ge 3 ] || { echo "FAIL: DireWolf packs missing"; FAIL=1; }
          [ "$(grep -c 'nearest fotm:.*_den' server/den.log)" -ge 3 ] || echo "WARN: not every den found by /locate"
          [ "$(grep -c 'Test passed, count: [12]$' server/den.log)" -ge 3 ] || { echo "FAIL: roughed up blocks did not drop 1-2 items"; FAIL=1; }
          grep -iE 'exception' server/den.log server/migrate.log | grep -iE 'fotm|wolfhorse' && FAIL=1
          exit $FAIL
      - name: "4. Blood Hunts"
        run: |
          rm -f server/mods/*.jar
          cp build/libs/$(grep '^jar_name=' gradle.properties | cut -d= -f2)-*.jar server/mods/
          at() { echo "execute positioned $1 0 $2 positioned over motion_blocking_no_leaves run summon $3 ~ ~ ~ {PersistenceRequired:1b}"; }
          box() { echo "@e[type=$1,x=$(( $2 - 40 )),y=-64,z=-40,dx=80,dy=400,dz=80]"; }
          {
            echo "time set 1000"
            echo "gamerule doDaylightCycle false"
            echo "forceload add 140 -60 260 60"
            echo "wait 10"
            for t in tundra plains dark_forest; do
              X=200
              for i in 1 2 3; do at $X 0 minecraft:villager; done
              for i in 1 2 3; do at $((X+3)) 2 minecraft:cow; done
              echo "wait 2"
              echo "execute if entity $(box minecraft:villager $X)"
              echo "execute if entity $(box minecraft:cow $X)"
              echo "bloodhunt start $t $X 64 0"
              echo "wait 12"
              echo "execute if entity @e[tag=fotm_blood_hunter]"
              echo "wait 50"
              echo "say RESULT $t"
              echo "execute if entity @e[tag=fotm_blood_hunter]"
              echo "execute as @e[tag=fotm_blood_hunter] run data get entity @s Pos"
              echo "execute as @e[tag=fotm_blood_hunter] run data get entity @s Brain"
              echo "execute as @e[type=minecraft:villager,limit=1] run data get entity @s Pos"
              echo "execute if entity $(box minecraft:villager $X)"
              echo "execute if entity $(box minecraft:cow $X)"
              echo "bloodhunt stop"
              echo "wait 8"
              echo "kill @e[type=minecraft:villager]"
              echo "kill @e[type=minecraft:cow]"
              echo "kill @e[type=minecraft:item]"
              echo "wait 3"
            done
          } > hunt.cmds
          cat hunt.cmds | head -20
          ./serve.sh hunt.log ../hunt.cmds
          echo "======== blood hunt results ========"
          grep -E 'Started a Blood Hunt|Stopped|Test passed|Test failed|RESULT|Unknown|Exception|exception|entity data: \[' server/hunt.log | cut -c1-200
          FAIL=0
          [ "$(grep -c 'Started a Blood Hunt' server/hunt.log)" -ge 3 ] || { echo "FAIL: hunts did not start"; FAIL=1; }
          grep -iE 'exception' server/hunt.log | grep -iE 'fotm|wolfhorse|blood' && FAIL=1
          exit $FAIL
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server/*.log
